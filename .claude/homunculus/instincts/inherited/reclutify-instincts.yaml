# Reclutify Workflow Add Or Update Database Table Or Function

## Action

Follow the add-or-update-database-table-or-function workflow:
1. Create or update SQL migration files in supabase/migrations/ (e.g., add table, function, RLS, revoke privileges).
2. Update supabase/repair or foundation SQL scripts if needed.
3. Update src/lib/database.types.ts to reflect new/changed database types.
4. Update backend logic or API handlers to use new/changed tables or functions.
5. Update or add tests to cover new/changed logic.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: supabase/migrations/*.sql, supabase/repair_*.sql, src/lib/database.types.ts

